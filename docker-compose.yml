services:
  redis:
    image: redis:alpine
    container_name: copiuma_cache
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16
    container_name: copiuma_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: copiuma_storage
    ports:
      - "18000:9000"
      - "18001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: copiuma_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  identity-api:
      build:
        context: .
        dockerfile: src/services/Identity.API/Dockerfile
      container_name: identity_api
      ports:
        - "5001:8080"
      environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=copiuma_identity;Username=admin;Password=password123
        - JwtSettings__Key=C0piuma_Super_Secret_Security_Key_2077
        - Redis__Configuration=redis:6379
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_started

  music-api:
    build:
      context: .
      dockerfile: src/services/Music.API/Dockerfile
    container_name: music_api
    ports:
      - "5002:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=copiuma_music;Username=admin;Password=password123
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=minioadmin
      - Minio__SecretKey=minioadmin
      - RabbitMQ__HostName=rabbitmq
      - Redis__Configuration=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started

  gateway-api:
    build:
      context: .
      dockerfile: src/api-gateway/Gateway.API/Dockerfile
    container_name: gateway_api
    ports:
      - "7161:8080"
    environment:
      - JwtSettings__Key=C0piuma_Super_Secret_Security_Key_2077
      - ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address=http://identity-api:8080
      - ReverseProxy__Clusters__music-cluster__Destinations__destination1__Address=http://music-api:8080
    depends_on:
      - identity-api
      - music-api