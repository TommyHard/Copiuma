<!DOCTYPE html>
<html>
<head>
    <title>Тест Уведомлений Music.API</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #fff;
            padding: 50px;
        }

        #log {
            background: #222;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid #1db954;
            font-family: monospace;
        }

        .success {
            color: #1db954;
        }
    </style>
</head>
<body>
    <h2>Локатор Уведомлений Music.API</h2>
    <div id="log">Ожидание подключения к серверу...</div>

    <script>
        const connection = new signalR.HubConnectionBuilder()
            .withUrl("http://localhost:5002/notifications")
            .build();

        connection.on("TrackProcessed", function (data) {
            const logDiv = document.getElementById("log");
            const newElement = document.createElement("p");
            newElement.innerHTML = `<span class="success">УВЕДОМЛЕНИЕ:</span> Трек <b>"${data.title}"</b> успешно обработан. Длительность: <b>${data.duration}</b>`;
            logDiv.prepend(newElement);

            new Audio('https://actions.google.com/sounds/v1/ui/message_notification.ogg').play();
        });

        connection.start()
            .then(() => document.getElementById("log").innerHTML = "<p>Подключено. Ожидание загрузки треков...</p>")
            .catch(err => console.error(err));
    </script>
</body>
</html>
